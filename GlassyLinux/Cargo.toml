[package]
name = "glassy-desk"
version = "0.1.0"
edition = "2021"
description = "Glassy Desk client for Linux (Omarchy/Hyprland): connects to Glassy Desk for Mac over the encrypted Glassy Stream protocol"
license = "UNLICENSED"
publish = false

[[bin]]
name = "glassy-desk"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ffmpeg-sys-next = { version = "9", default-features = false, features = ["avcodec"] }
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
libc = "0.2"
mdns-sd = "0.13"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rpassword = "7"
sdl2 = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[profile.release]
opt-level = 3
lto = "thin"
